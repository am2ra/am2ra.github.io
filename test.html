<!DOCTYPE html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.0/jquery.min.js"></script>
    <script type="text/javascript">
        var lastfmData = {
            baseURL:'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=',
            // Your Last.fm Username
            user: '<USERNAME>',
            // Your API key
            api_key: '<APIKEY>',
            additional: '&format=json&limit=1',
        }

        var getSetLastFM = function () {
            $.ajax({
                type: 'GET',
                url:
                    lastfmData.baseURL +
                    lastfmData.user +
                    '&api_key=' +
                    lastfmData.api_key +
                    lastfmData.additional,
                dataType: 'json',
                success: function (resp) {
                    let nowplaying = null;
                    nowplaying = resp.recenttracks.track[0]['@attr'];
                    var x = document.getElementById("trackart");
                    var y = document.getElementById("trackartist");
                    var z = document.getElementById("tracktitle");
                    x.style.display = "none";
                    y.style.display = "none";
                    z.style.display = "none";
                    if (nowplaying.nowplaying === 'true')
                    {
                        x.style.display = "block";
                        y.style.display = "block";
                        z.style.display = "block";
                        var recentTrack = resp.recenttracks.track[0];
                        var formatted = recentTrack.name;
                        $('a#tracktitle')
                            .html(formatted)
                            .attr('title', recentTrack.name + ' by ' + recentTrack.artist['#text'])
                            .attr('target', '_blank');
                        var artistFormatted = recentTrack.artist['#text'];
                        $('a#trackartist')
                            .html(artistFormatted)
                            .attr('title', 'Artist : ' + recentTrack.artist['#text']);
                        $('img#trackart').attr('src', recentTrack.image[3]['#text']);
                    };
                },
                error: function (resp) {
                    $('a#tracktitle').html(' ');
                    $('img#trackart').attr('src', 'https://imgur.com/SxvDy8G');
                    var artistFormatted = "<img src='https://imgur.com/SxvDy8G'> ";
                    $('a#trackartist').html(artistFormatted);
                },
            })
        };

        // Get the new one.
        getSetLastFM();
        // Start the countdown.
        setInterval(getSetLastFM, 10 * 1000);

    </script>
    <style>
        div.aligncenter {
            text-align: center;
        }

        img {
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <div font-size="3" color="#E6E6E6">
        <div>
            <img id="trackart" src="#">
            <div class="aligncenter">
                <a id="trackartist"></a>
                <a id="tracktitle"></a>

            </div>

    </div>
    </div>
</body>
</html>
